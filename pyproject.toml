[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-security-lab"
version = "0.4.0"
description = "Reproducible security labs for GenAI and agentic AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Kedar Mohile" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
agentic-ai-memory-isolation = "agentic_ai_security_lab.memory_isolation:main"
agentic-ai-tool-authorization = "agentic_ai_security_lab.tool_authorization:main"
agentic-ai-retrieval-poisoning = "agentic_ai_security_lab.retrieval_poisoning:main"
agentic-ai-delegation-boundary = "agentic_ai_security_lab.delegation_boundary:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
