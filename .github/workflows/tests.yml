name: tests

on:
  push:
    branches:
      - main
      - "lab/**"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Check console assets
        run: agentic-ai-console --check
      - name: Check console JavaScript
        run: node --check src/agentic_ai_security_lab/console_assets/app.js
